<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="-apple-system,'Apple SD Gothic Neo','Pretendard',sans-serif">
  <defs>
    <style>
      .bg{fill:#F6EEDE}
      .card{fill:#FFFFFF;stroke:#514C44;stroke-width:1.5}
      .primary{fill:#ABBCA2}
      .accent{fill:#617C53}
      .pink{fill:#F49496}
      .text{fill:#514C44}
      .title{font-size:20px;fill:#514C44;font-weight:700}
      .label{font-size:14px;fill:#514C44;font-weight:700}
      .head{font-size:13px;fill:#FFFFFF;font-weight:700}
      .small{font-size:12px;fill:#514C44}
      .arrow{stroke:#514C44;stroke-width:1.5;fill:none;marker-end:url(#arr)}
      .pinkArrow{stroke:#F49496;stroke-width:1.8;fill:none;marker-end:url(#arrp)}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#514C44"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#F49496"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text x="40" y="46" class="title">Deployment / CI·CD</text>
  <text x="40" y="68" class="small">GitHub Actions → 환경별 자동 배포 + EAS OTA 핫픽스</text>

  <!-- GitHub -->
  <rect x="40" y="110" width="240" height="80" rx="10" class="card"/>
  <rect x="40" y="110" width="240" height="28" rx="10" class="primary"/>
  <text x="60" y="129" class="head">📦 GitHub Repo (monorepo)</text>
  <text x="60" y="160" class="small">apps/{mobile,admin,landing}</text>
  <text x="60" y="178" class="small">supabase/{migrations,functions}</text>

  <!-- Actions -->
  <rect x="320" y="110" width="240" height="80" rx="10" class="card"/>
  <rect x="320" y="110" width="240" height="28" rx="10" class="accent"/>
  <text x="340" y="129" class="head">⚙️ GitHub Actions</text>
  <text x="340" y="160" class="small">lint-test · migrate · web-deploy</text>
  <text x="340" y="178" class="small">mobile-release (tag mobile-v*)</text>

  <!-- Environments -->
  <text x="40" y="230" class="label">3 Environments</text>

  <rect x="40"  y="250" width="360" height="240" rx="12" fill="#ABBCA2" opacity="0.18"/>
  <text x="60"  y="278" class="label">dev (로컬)</text>
  <rect x="60"  y="296" width="150" height="50" rx="8" class="card"/>
  <text x="135" y="318" text-anchor="middle" class="small">Expo Go</text>
  <text x="135" y="334" text-anchor="middle" class="small">simulator</text>
  <rect x="220" y="296" width="160" height="50" rx="8" class="card"/>
  <text x="300" y="318" text-anchor="middle" class="small">Supabase 로컬</text>
  <text x="300" y="334" text-anchor="middle" class="small">(Docker)</text>
  <rect x="60"  y="360" width="320" height="50" rx="8" class="card"/>
  <text x="220" y="382" text-anchor="middle" class="small">Next.js dev (admin/landing)</text>
  <text x="220" y="398" text-anchor="middle" class="small">localhost:3000 / :5173</text>

  <rect x="420" y="250" width="360" height="240" rx="12" fill="#617C53" opacity="0.18"/>
  <text x="440" y="278" class="label">staging</text>
  <rect x="440" y="296" width="150" height="50" rx="8" class="card"/>
  <text x="515" y="318" text-anchor="middle" class="small">EAS preview</text>
  <text x="515" y="334" text-anchor="middle" class="small">(internal QA)</text>
  <rect x="600" y="296" width="160" height="50" rx="8" class="card"/>
  <text x="680" y="318" text-anchor="middle" class="small">Supabase Branch</text>
  <text x="680" y="334" text-anchor="middle" class="small">DB</text>
  <rect x="440" y="360" width="320" height="50" rx="8" class="card"/>
  <text x="600" y="382" text-anchor="middle" class="small">Vercel preview (PR별)</text>
  <text x="600" y="398" text-anchor="middle" class="small">staging.admin.jaringobi.app</text>

  <rect x="800" y="250" width="360" height="240" rx="12" fill="#F49496" opacity="0.18"/>
  <text x="820" y="278" class="label">prod</text>
  <rect x="820" y="296" width="150" height="50" rx="8" class="card"/>
  <text x="895" y="318" text-anchor="middle" class="small">App Store</text>
  <text x="895" y="334" text-anchor="middle" class="small">Google Play</text>
  <rect x="980" y="296" width="160" height="50" rx="8" class="card"/>
  <text x="1060" y="318" text-anchor="middle" class="small">Supabase prod</text>
  <text x="1060" y="334" text-anchor="middle" class="small">PITR 7d</text>
  <rect x="820" y="360" width="320" height="50" rx="8" class="card"/>
  <text x="980" y="382" text-anchor="middle" class="small">Vercel prod</text>
  <text x="980" y="398" text-anchor="middle" class="small">jaringobi.app · admin.jaringobi.app</text>

  <!-- Pipeline arrows -->
  <path class="arrow" d="M280 150 L320 150"/>
  <path class="arrow" d="M440 190 L220 250"/>
  <path class="arrow" d="M440 190 L600 250"/>
  <path class="arrow" d="M440 190 L980 250"/>

  <text x="220" y="220" class="small" text-anchor="middle">PR · push</text>
  <text x="600" y="220" class="small" text-anchor="middle">main merge</text>
  <text x="980" y="220" class="small" text-anchor="middle">tag mobile-v* / 수동 승인</text>

  <!-- OTA -->
  <rect x="40" y="540" width="1120" height="100" rx="12" class="card"/>
  <rect x="40" y="540" width="200" height="28" rx="12" class="pink"/>
  <text x="60" y="559" class="head">⚡ OTA Hotfix Lane</text>
  <text x="60" y="586" class="small">JS · 이미지만 변경 시: <tspan font-weight="700">eas update --branch production</tspan></text>
  <text x="60" y="606" class="small">앱스토어 심사 우회 → 분 단위 반영. 네이티브 모듈 변경 시는 정식 빌드.</text>
  <path class="pinkArrow" d="M280 150 C 700 150, 700 540, 600 540"/>

  <!-- Secrets -->
  <rect x="40" y="670" width="1120" height="60" rx="10" fill="#FFFFFF" stroke="#514C44" stroke-width="1"/>
  <text x="60" y="694" class="label">🔐 Secrets</text>
  <text x="160" y="694" class="small">1Password Connect → GitHub OIDC → Vercel/EAS/Supabase</text>
  <text x="160" y="714" class="small">클라이언트엔 anon key만, service_role 키는 Edge Fn 환경변수 전용</text>
</svg>
