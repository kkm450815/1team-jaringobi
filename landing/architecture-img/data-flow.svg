<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1200 760" font-family="-apple-system,'Apple SD Gothic Neo','Pretendard',sans-serif">
  <defs>
    <style>
      .bg{fill:#F6EEDE}
      .lane{fill:#FFFFFF;stroke:#514C44;stroke-width:1.2}
      .head{fill:#ABBCA2}
      .accent{fill:#617C53}
      .pink{fill:#F49496}
      .text{fill:#514C44}
      .title{font-size:20px;fill:#514C44;font-weight:700}
      .label{font-size:14px;fill:#514C44;font-weight:700}
      .small{font-size:12px;fill:#514C44}
      .step{font-size:12px;fill:#FFFFFF;font-weight:700}
      .arrow{stroke:#514C44;stroke-width:1.5;fill:none;marker-end:url(#arr)}
      .dash{stroke:#F49496;stroke-width:1.5;fill:none;stroke-dasharray:6 4;marker-end:url(#arrp)}
    </style>
    <marker id="arr" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#514C44"/>
    </marker>
    <marker id="arrp" viewBox="0 0 10 10" refX="9" refY="5" markerWidth="7" markerHeight="7" orient="auto">
      <path d="M0,0 L10,5 L0,10 Z" fill="#F49496"/>
    </marker>
  </defs>
  <rect class="bg" width="1200" height="760"/>
  <text x="40" y="46" class="title">데이터 플로우 — 인증샷 업로드 → 보상 지급</text>
  <text x="40" y="68" class="small">실선: 동기 호출 / 점선(핑크): 비동기·Realtime</text>

  <!-- Lanes -->
  <g>
    <rect x="40"   y="100" width="200" height="600" rx="10" class="lane"/>
    <rect x="40"   y="100" width="200" height="36"  rx="10" class="head"/>
    <text x="140" y="124" text-anchor="middle" class="label">📱 App (Expo)</text>

    <rect x="260"  y="100" width="220" height="600" rx="10" class="lane"/>
    <rect x="260"  y="100" width="220" height="36"  rx="10" class="head"/>
    <text x="370" y="124" text-anchor="middle" class="label">⚡ Edge Function</text>

    <rect x="500"  y="100" width="220" height="600" rx="10" class="lane"/>
    <rect x="500"  y="100" width="220" height="36"  rx="10" class="head"/>
    <text x="610" y="124" text-anchor="middle" class="label">🗂 Storage</text>

    <rect x="740"  y="100" width="220" height="600" rx="10" class="lane"/>
    <rect x="740"  y="100" width="220" height="36"  rx="10" class="head"/>
    <text x="850" y="124" text-anchor="middle" class="label">🐘 Postgres</text>

    <rect x="980"  y="100" width="180" height="600" rx="10" class="lane"/>
    <rect x="980"  y="100" width="180" height="36"  rx="10" class="head"/>
    <text x="1070" y="124" text-anchor="middle" class="label">🛡 Sightengine</text>
  </g>

  <!-- Step labels along left -->
  <g font-family="inherit">
    <circle cx="60" cy="170" r="14" class="accent"/><text x="60" y="174" text-anchor="middle" class="step">1</text>
    <text x="80" y="174" class="small">presigned URL 요청</text>

    <circle cx="60" cy="220" r="14" class="accent"/><text x="60" y="224" text-anchor="middle" class="step">2</text>
    <text x="80" y="224" class="small">URL 응답</text>

    <circle cx="60" cy="280" r="14" class="accent"/><text x="60" y="284" text-anchor="middle" class="step">3</text>
    <text x="80" y="284" class="small">PUT photo</text>

    <circle cx="60" cy="340" r="14" class="accent"/><text x="60" y="344" text-anchor="middle" class="step">4</text>
    <text x="80" y="344" class="small">Storage Webhook</text>

    <circle cx="60" cy="400" r="14" class="accent"/><text x="60" y="404" text-anchor="middle" class="step">5</text>
    <text x="80" y="404" class="small">EXIF strip + hash</text>

    <circle cx="60" cy="460" r="14" class="accent"/><text x="60" y="464" text-anchor="middle" class="step">6</text>
    <text x="80" y="464" class="small">NSFW score</text>

    <circle cx="60" cy="520" r="14" class="accent"/><text x="60" y="524" text-anchor="middle" class="step">7</text>
    <text x="80" y="524" class="small">grant_rewards (TX)</text>

    <circle cx="60" cy="600" r="14" class="pink"/><text x="60" y="604" text-anchor="middle" class="step">8</text>
    <text x="80" y="604" class="small">Realtime CDC</text>

    <circle cx="60" cy="660" r="14" class="pink"/><text x="60" y="664" text-anchor="middle" class="step">9</text>
    <text x="80" y="664" class="small">UI 보상 애니메이션</text>
  </g>

  <!-- Arrows between lanes (centers ~140,370,610,850,1070) -->
  <path class="arrow" d="M150 170 L360 170"/>
  <path class="arrow" d="M360 220 L150 220"/>
  <path class="arrow" d="M150 280 L600 280"/>
  <path class="arrow" d="M600 340 L380 340"/>
  <path class="arrow" d="M370 400 L370 440"/>
  <text x="380" y="420" class="small">strip + hash 자체 처리</text>
  <path class="arrow" d="M380 460 L1060 460"/>
  <path class="arrow" d="M1060 480 L380 480"/>
  <text x="500" y="478" class="small">score</text>
  <path class="arrow" d="M380 520 L840 520"/>
  <text x="500" y="510" class="small">RPC grant_rewards</text>

  <path class="dash" d="M840 600 L150 600"/>
  <text x="500" y="592" class="small">CDC: coins/+saved_amount</text>
  <path class="dash" d="M150 660 L150 700"/>
  <text x="80" y="690" class="small">+10,000원 / +100P</text>
</svg>
